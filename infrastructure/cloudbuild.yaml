# ===================================================
# BreatheWise AI — Google Cloud Build CI/CD Pipeline
# Automates Container Build, Artifact Registry push, and Cloud Run deployment
# ===================================================

steps:
  # 1. Build Production Container Image using Kaniko / Docker cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infrastructure/Dockerfile'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai:$SHORT_SHA'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai:latest'
      - '.'

  # 2. Push Container Image to Google Cloud Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai'

  # 3. Deploy Service to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'breathewise-ai'
      - '--image'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai:$SHORT_SHA'
      - '--region'
      - '${_LOCATION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_AI_MODEL_ID=gemini-1.5-flash,FIRESTORE_MODE=firestore'
      - '--service-account'
      - 'breathewise-service@$PROJECT_ID.iam.gserviceaccount.com'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'breathewise-repo'

images:
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai:$SHORT_SHA'
  - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/breathewise-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
